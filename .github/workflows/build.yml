name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: multiverselab-jar
          path: build/libs/multiverselab-*.jar
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-reports
          path: build/reports
          if-no-files-found: ignore
